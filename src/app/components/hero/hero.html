<section id="hero" class="hero" aria-label="Introduction" #heroSection>

  <!-- Ambient background orbs -->
  <div class="hero__orb hero__orb--1" aria-hidden="true"></div>
  <div class="hero__orb hero__orb--2" aria-hidden="true"></div>
  <div class="hero__grid" aria-hidden="true"></div>

  <div class="container hero__container">
    <div class="hero__layout">

      <!-- Left: Text content -->
      <div class="hero__content">

        <!-- Eyebrow -->
        <div class="hero__eyebrow">
          <span class="hero__status-dot" aria-hidden="true"></span>
          <span class="font-mono" style="font-size: var(--text-sm); color: var(--color-text-secondary);">
            Available for opportunities
          </span>
        </div>

        <!-- Name -->
        <h1 class="hero__name">
          <span class="hero__name-hi">Hi, I'm</span>
          <br>
          <span class="hero__name-main">{{ profile().name }}</span>
        </h1>

        <!-- Title -->
        <div class="hero__title-wrapper">
          <p class="hero__title">
            <svg class="hero__title-spark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07l14.14-14.14"/>
            </svg>
            <span class="hero__title-text">{{ profile().professionalTitle }}</span>
          </p>
        </div>

        <!-- Summary -->
        <p class="hero__summary">{{ profile().summary }}</p>

        <!-- Focus tags -->
        <div class="hero__tags" role="list" aria-label="Areas of focus">
          @for (tag of focusTags(); track tag) {
            <span class="tag" role="listitem">{{ tag }}</span>
          }
        </div>

        <!-- CTAs -->
        <div class="hero__actions">
          <a
            class="btn btn--primary"
            href="#projects"
            (click)="$event.preventDefault(); navigateTo('#projects')"
          >
            View Projects
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </a>
          <a
            class="btn btn--outline"
            href="#contact"
            (click)="$event.preventDefault(); navigateTo('#contact')"
          >
            Get in Touch
          </a>
          @if (socialLinks().github) {
            <a
              class="btn btn--ghost"
              [href]="socialLinks().github!"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="View GitHub profile"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
              </svg>
              GitHub
            </a>
          }
        </div>

      </div>

      <!-- Right: AI Character Canvas (scroll-scrubbed frame sequence) -->
      <div class="hero__video-wrapper">
        <div class="hero__video-container">
          <canvas
            #heroCanvas
            class="hero__canvas"
            aria-hidden="true"
          ></canvas>

          <!-- Laptop interaction area -->
          <div
            class="hero__laptop-zone"
            [class.hero__laptop-zone--active]="laptopHovered()"
            (pointerenter)="onLaptopEnter()"
            (pointerleave)="onLaptopLeave()"
            aria-hidden="true"
          ></div>

          <!-- Subtle glow on laptop hover -->
          @if (laptopHovered()) {
            <div class="hero__laptop-glow" aria-hidden="true"></div>
          }
        </div>
      </div>

    </div>

    <!-- Scroll indicator -->
    <div class="hero__scroll" aria-hidden="true">
      <div class="hero__scroll-line"></div>
    </div>
  </div>
</section>
