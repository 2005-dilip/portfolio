<aside class="resume-widget" role="complementary" aria-label="Resume quick link">
  <a
    [href]="resumeUrl()"
    target="_blank"
    rel="noopener noreferrer"
    class="resume-badge"
    [style.transform]="transformStyle()"
    title="Open Resume PDF in a new tab"
    aria-label="Open Resume PDF in a new tab"
  >
    <!-- Document Icon -->
    <svg class="resume-badge__icon resume-badge__icon--doc" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
    </svg>

    <!-- Resume Label -->
    <span class="resume-badge__label">Resume</span>

    <!-- Arrow / External Link Icon -->
    <svg class="resume-badge__icon resume-badge__icon--arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="7" y1="17" x2="17" y2="7"/>
      <polyline points="7 7 17 7 17 17"/>
    </svg>
  </a>
</aside>
