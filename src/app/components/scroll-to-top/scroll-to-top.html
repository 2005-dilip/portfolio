@if (showButton()) {
  <button
    type="button"
    class="scroll-top-btn"
    (click)="scrollToTop()"
    title="Back to top"
    aria-label="Back to top"
  >
    <svg class="scroll-top-btn__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5"/>
      <polyline points="5 12 12 5 19 12"/>
    </svg>
    <span class="scroll-top-btn__label">Top</span>
  </button>
}
